name: Publish release APK

run-name: Release ${{ inputs.bump }} version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment for an existing release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Only one release may run at a time. Additional runs wait instead of
# interrupting a build that may already be publishing an APK.
concurrency:
  group: familyarchivegallery-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main with tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Calculate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT_VERSION=$(grep -m1 'versionName = "' app/build.gradle.kts | cut -d '"' -f 2)
          CURRENT_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | awk '{print $3}')

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "versionName must use MAJOR.MINOR.PATCH format" >&2
            exit 1
          fi
          if [[ ! "$CURRENT_CODE" =~ ^[0-9]+$ ]]; then
            echo "versionCode must be an integer" >&2
            exit 1
          fi

          CURRENT_TAG="v$CURRENT_VERSION"
          if git rev-parse --verify --quiet "refs/tags/$CURRENT_TAG" >/dev/null; then
            if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
              IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
              case "$BUMP" in
                patch) PATCH=$((PATCH + 1)) ;;
                minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
                major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
                *) echo "Unsupported version increment: $BUMP" >&2; exit 1 ;;
              esac
              RELEASE_VERSION="$MAJOR.$MINOR.$PATCH"
              RELEASE_CODE=$((CURRENT_CODE + 1))
              UPDATE_SOURCE=true
            else
              echo "Tag $CURRENT_TAG exists without a release; retrying it."
              RELEASE_VERSION="$CURRENT_VERSION"
              RELEASE_CODE="$CURRENT_CODE"
              UPDATE_SOURCE=false
            fi
          else
            echo "Publishing the current project version as the first release."
            RELEASE_VERSION="$CURRENT_VERSION"
            RELEASE_CODE="$CURRENT_CODE"
            UPDATE_SOURCE=false
          fi

          RELEASE_TAG="v$RELEASE_VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi

          if [ "$UPDATE_SOURCE" = true ]; then
            if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "Tag $RELEASE_TAG already exists" >&2
              exit 1
            fi
            sed -i -E "s/versionCode = [0-9]+/versionCode = $RELEASE_CODE/" app/build.gradle.kts
            sed -i -E "s/versionName = \"[0-9]+\.[0-9]+\.[0-9]+\"/versionName = \"$RELEASE_VERSION\"/" app/build.gradle.kts
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$RELEASE_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "update_source=$UPDATE_SOURCE" >> "$GITHUB_OUTPUT"
          echo "### Preparing $RELEASE_TAG (versionCode $RELEASE_CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Decode release keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/familyarchivegallery.jks"

      - name: Test, lint, and build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/familyarchivegallery.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew test lintRelease assembleRelease

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/familyarchivegallery.apk
          cd dist
          sha256sum familyarchivegallery.apk > familyarchivegallery.apk.sha256

      - name: Commit version and push tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          UPDATE_SOURCE: ${{ steps.version.outputs.update_source }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$UPDATE_SOURCE" = true ]; then
            git add app/build.gradle.kts
            git commit -m "Prepare release $RELEASE_VERSION"
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            git tag "$RELEASE_TAG"
            git push --atomic origin HEAD:main "refs/tags/$RELEASE_TAG"
          elif [ "$UPDATE_SOURCE" = true ]; then
            echo "Refusing to move existing tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/familyarchivegallery.apk \
            dist/familyarchivegallery.apk.sha256 \
            --verify-tag \
            --generate-notes \
            --title "Family Archive Gallery $RELEASE_TAG"
